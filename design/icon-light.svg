<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F1FF"/><stop offset="1" stop-color="#D9D2FF"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient></defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<circle cx="512" cy="480" r="420" fill="url(#glow)"/>
<g transform="translate(112 100) scale(1.5625)">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3A8FF"/>
      <stop offset="0.55" stop-color="#7B80F5"/>
      <stop offset="1" stop-color="#5A5ED8"/>
    </linearGradient>
    <linearGradient id="plateDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5D61D9"/>
      <stop offset="1" stop-color="#3F42B0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4EE"/>
      <stop offset="1" stop-color="#F3C9BD"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7A39A"/>
      <stop offset="1" stop-color="#DE6F67"/>
    </linearGradient>
    <linearGradient id="heart" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FF9A9A"/>
      <stop offset="0.6" stop-color="#F7737B"/>
      <stop offset="1" stop-color="#E4505E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.5" stop-color="#FFC046"/>
      <stop offset="1" stop-color="#F29A1F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1B1650" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Destellos -->
  <g filter="url(#soft)">
    <path transform="translate(150 168) scale(1.05)" fill="url(#gold)" d="M0,-52 C7,-13 13,-7 52,0 C13,7 7,13 0,52 C-7,13 -13,7 -52,0 C-13,-7 -7,-13 0,-52 Z"/>
    <path transform="translate(150 168) scale(1.05)" fill="#FFF6D6" opacity="0.7" d="M0,-40 C3,-14 6,-9 14,-6 C6,-4 2,-14 0,-40 Z"/>
    <path transform="translate(92 92) scale(0.5)" fill="url(#gold)" d="M0,-52 C7,-13 13,-7 52,0 C13,7 7,13 0,52 C-7,13 -13,7 -52,0 C-13,-7 -7,-13 0,-52 Z"/>
  </g>

  <!-- Corazón con pulso -->
  <g transform="translate(346 150) scale(1.22)" filter="url(#soft)">
    <path fill="url(#heart)" d="M0,62 C-84,12 -94,-50 -52,-67 C-26,-77 -6,-62 0,-46 C6,-62 26,-77 52,-67 C94,-50 84,12 0,62 Z"/>
    <ellipse cx="-38" cy="-44" rx="18" ry="10" fill="#FFFFFF" opacity="0.45" transform="rotate(-30 -38 -44)"/>
    <path fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M-78,-4 L-30,-4 L-16,-30 L2,26 L18,-14 L28,-2 L78,-2"/>
  </g>

  <!-- Mancuerna -->
  <g transform="translate(256 374) rotate(-16)" filter="url(#soft)">
    <rect x="-196" y="-13" width="392" height="26" rx="13" fill="url(#bar)"/>
    <!-- lado izquierdo -->
    <rect x="-100" y="-26" width="22" height="52" rx="8" fill="url(#collar)"/>
    <rect x="-152" y="-96" width="52" height="192" rx="24" fill="url(#plateDark)"/>
    <rect x="-146" y="-100" width="50" height="190" rx="24" fill="url(#plate)"/>
    <rect x="-184" y="-70" width="38" height="140" rx="18" fill="url(#plateDark)"/>
    <rect x="-180" y="-74" width="36" height="138" rx="18" fill="url(#plate)"/>
    <rect x="-138" y="-86" width="10" height="120" rx="5" fill="#FFFFFF" opacity="0.28"/>
    <!-- lado derecho -->
    <rect x="78" y="-26" width="22" height="52" rx="8" fill="url(#collar)"/>
    <rect x="100" y="-96" width="52" height="192" rx="24" fill="url(#plateDark)"/>
    <rect x="96" y="-100" width="50" height="190" rx="24" fill="url(#plate)"/>
    <rect x="146" y="-70" width="38" height="140" rx="18" fill="url(#plateDark)"/>
    <rect x="144" y="-74" width="36" height="138" rx="18" fill="url(#plate)"/>
    <rect x="106" y="-86" width="10" height="120" rx="5" fill="#FFFFFF" opacity="0.28"/>
  </g>
</g>
</svg>
